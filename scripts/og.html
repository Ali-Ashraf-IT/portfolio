<!doctype html>
<!-- Source for public/og.png (1200x630 social share image).
     Regenerate with: npm run og   (uses Microsoft Edge in headless mode) -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: BSD; src: url('../node_modules/@fontsource/big-shoulders-display/files/big-shoulders-display-latin-900-normal.woff2'); font-weight: 900; }
  @font-face { font-family: MAN; src: url('../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2'); font-weight: 200 800; }
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#060a13;color:#e9eef8;font-family:MAN,sans-serif;position:relative;
    background-image:linear-gradient(rgba(120,160,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.07) 1px,transparent 1px);background-size:48px 48px}
  .name{position:absolute;left:64px;top:40px;font-family:BSD;font-weight:900;font-size:230px;line-height:.82;text-transform:uppercase;letter-spacing:-2px}
  .name span{display:block;color:#4d94ff}
  .role{position:absolute;left:68px;bottom:96px;font-family:BSD;font-weight:900;font-size:52px;text-transform:uppercase}
  .tag{position:absolute;left:68px;bottom:50px;font-size:26px;color:#9aa8c3;font-weight:600}
  .ring{position:absolute;right:70px;top:120px;width:300px;height:300px;border-radius:50%;border:3px solid #57d9e8;box-shadow:0 0 80px -10px #57d9e8;display:grid;place-items:center;font-family:BSD;font-weight:900;font-size:130px;color:#4d94ff;background:#0c1424}
</style></head>
<body>
  <div class="name">Ali<span>Ashraf</span></div>
  <div class="ring">AA</div>
  <div class="role">System Engineer &middot; IT Operations</div>
  <div class="tag">Infrastructure &middot; n8n automation &middot; Security operations</div>
</body></html>
